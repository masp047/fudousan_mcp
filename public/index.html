<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理空間データ照会 | JSTT</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #faf9f7;
    --line: #d8d4cc;
    --accent: #b04123;
    --accent-soft: #f3e4de;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header h1 {
    margin: 4px 0 0;
    font-size: 22px;
    font-weight: 700;
  }
  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #666;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }
  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #888;
    margin: 0 0 14px;
  }
  .coord-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 160px;
  }
  .field label {
    font-size: 12px;
    color: #666;
  }
  input[type=text], input[type=number], input[type=password] {
    font-family: var(--mono);
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .api-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 4px 16px;
  }
  .api-group { margin-bottom: 10px; }
  .api-group h3 {
    font-size: 11px;
    color: var(--accent);
    margin: 10px 0 4px;
    letter-spacing: 0.03em;
  }
  .api-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    padding: 3px 0;
  }
  .api-item input { margin: 0; accent-color: var(--accent); }

  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 16px;
  }
  button {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: #888;
  }

  #results { display: flex; flex-direction: column; gap: 12px; }
  .result-card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .result-card.empty { border-left-color: var(--line); opacity: 0.6; }
  .result-card h4 {
    margin: 0 0 8px;
    font-size: 14px;
  }
  .result-card .count {
    font-family: var(--mono);
    font-size: 11px;
    color: #888;
    font-weight: 400;
  }
  pre {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    overflow-x: auto;
    max-height: 300px;
    margin: 0;
  }
  .map-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--accent);
  }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 10px 24px 40px;
    font-size: 11px;
    color: #999;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">JSTT / GRC推進部 &mdash; 検証用プロトタイプ</div>
  <h1>地理空間データ照会</h1>
  <p>不動産情報ライブラリAPI（国土交通省）を緯度経度から照会します。α版データを含むため、開示資料への転記前に必ず一次資料と突き合わせてください。</p>
</header>

<main>

  <div class="panel">
    <h2>1. 対象地点</h2>
    <div class="coord-row">
      <div class="field">
        <label for="lat">緯度</label>
        <input type="text" id="lat" placeholder="例: 43.06788044783783">
      </div>
      <div class="field">
        <label for="lon">経度</label>
        <input type="text" id="lon" placeholder="例: 141.3541094042721">
      </div>
      <div class="field" style="max-width: 140px;">
        <label for="year">対象年（任意）</label>
        <input type="number" id="year" placeholder="2024">
      </div>
      <div class="field" style="max-width: 200px;" id="token-field">
        <label for="token">アクセストークン</label>
        <input type="password" id="token" placeholder="必要な場合のみ">
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>2. 取得する項目（未選択なら全30項目）</h2>
    <div id="api-checkboxes"></div>
    <div class="actions">
      <button class="secondary" type="button" id="select-all">全選択</button>
      <button class="secondary" type="button" id="select-none">選択解除</button>
    </div>
  </div>

  <div class="actions" style="margin-bottom: 20px;">
    <button type="button" id="run">照会する</button>
    <span class="status" id="status"></span>
  </div>

  <div id="results"></div>

</main>

<footer>
  データ出典：不動産情報ライブラリ（国土交通省）／このツールは社内検証用のα版連携です。取得値の正確性は保証されません。
</footer>

<script>
const API_NAMES = {
  1: "不動産価格（取引価格・成約価格）情報", 2: "鑑定評価書情報", 3: "地価公示・地価調査のポイント",
  4: "都市計画区域・区域区分", 5: "用途地域", 6: "立地適正化計画",
  7: "小学校区", 8: "中学校区", 9: "学校", 10: "保育園・幼稚園等",
  11: "医療機関", 12: "福祉施設", 17: "図書館", 18: "市区町村役場等",
  13: "将来推計人口(250mメッシュ)", 15: "駅別乗降客数", 30: "人口集中地区",
  16: "災害危険区域", 20: "大規模盛土造成地マップ", 21: "地すべり防止地区",
  22: "急傾斜地崩壊危険区域", 25: "液状化発生傾向図", 26: "洪水浸水想定区域",
  27: "高潮浸水想定区域", 28: "津波浸水想定", 29: "土砂災害警戒区域",
  14: "防火・準防火地域", 23: "地区計画", 24: "高度利用地区", 19: "自然公園地域"
};
const GROUPS = [
  ["不動産取引・評価", [1,2,3]],
  ["都市計画", [4,5,6,14,23,24]],
  ["教育・保育", [7,8,9,10]],
  ["医療・福祉・生活", [11,12,17,18]],
  ["人口・交通", [13,15,30]],
  ["防災・ハザード", [16,20,21,22,25,26,27,28,29]],
  ["自然環境", [19]],
];

const wrap = document.getElementById("api-checkboxes");
GROUPS.forEach(([label, ids]) => {
  const group = document.createElement("div");
  group.className = "api-group";
  group.innerHTML = `<h3>${label}</h3>`;
  const grid = document.createElement("div");
  grid.className = "api-grid";
  ids.forEach(id => {
    const item = document.createElement("label");
    item.className = "api-item";
    item.innerHTML = `<input type="checkbox" value="${id}"> ${id}. ${API_NAMES[id]}`;
    grid.appendChild(item);
  });
  group.appendChild(grid);
  wrap.appendChild(group);
});

document.getElementById("select-all").onclick = () => {
  document.querySelectorAll('.api-item input').forEach(cb => cb.checked = true);
};
document.getElementById("select-none").onclick = () => {
  document.querySelectorAll('.api-item input').forEach(cb => cb.checked = false);
};

document.getElementById("run").onclick = async () => {
  const lat = document.getElementById("lat").value.trim();
  const lon = document.getElementById("lon").value.trim();
  const year = document.getElementById("year").value.trim();
  const token = document.getElementById("token").value.trim();
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const runBtn = document.getElementById("run");

  if (!lat || !lon) {
    status.textContent = "緯度・経度を入力してください";
    return;
  }

  const checked = Array.from(document.querySelectorAll('.api-item input:checked')).map(cb => cb.value);

  const params = new URLSearchParams({ lat, lon });
  if (checked.length) params.set("apis", checked.join(","));
  if (year) params.set("year", year);
  if (token) params.set("token", token);

  runBtn.disabled = true;
  status.textContent = "照会中...";
  results.innerHTML = "";

  try {
    const res = await fetch(`/api/query?${params.toString()}`);
    const json = await res.json();

    if (!res.ok || json.status === "error") {
      status.textContent = `エラー: ${json.message || res.status}`;
      runBtn.disabled = false;
      return;
    }

    const data = json.data || {};
    const apiResults = data.api_results || [];
    const targetIds = checked.length ? checked.map(Number) : Object.keys(API_NAMES).map(Number).sort((a,b)=>a-b);

    status.textContent = `完了（${apiResults.filter(r => r).length} / ${apiResults.length} 件にデータあり）`;

    apiResults.forEach((r, idx) => {
      const apiId = targetIds[idx];
      const name = API_NAMES[apiId] || `API ${apiId}`;
      const card = document.createElement("div");

      if (!r) {
        card.className = "result-card empty";
        card.innerHTML = `<h4>${apiId}. ${name} <span class="count">該当データなし</span></h4>`;
      } else {
        const features = (r.data && r.data.features) ? r.data.features : null;
        const countLabel = features ? `${features.length}件` : "";
        card.className = "result-card";
        card.innerHTML = `<h4>${apiId}. ${name} <span class="count">${countLabel}</span></h4>
          <pre>${escapeHtml(JSON.stringify(r.data, null, 2))}</pre>`;
      }
      results.appendChild(card);
    });

    if (data.map_url) {
      const link = document.createElement("a");
      link.href = data.map_url;
      link.target = "_blank";
      link.className = "map-link";
      link.textContent = "→ 不動産情報ライブラリの地図で確認する";
      results.appendChild(link);
    }
  } catch (e) {
    status.textContent = `通信エラー: ${e}`;
  } finally {
    runBtn.disabled = false;
  }
};

function escapeHtml(str) {
  return str.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
</script>

</body>
</html>
